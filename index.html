<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ReceptionMonk – AI Receptionist Reel</title>
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/layout.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/animation.css" />
</head>
<body class="preview-mode">
    <div class="stage-viewport" id="stage-viewport">
        <main class="reel-stage" id="reel-stage" data-section="opening" data-active-speaker="none">
            <!-- Background Layers -->
            <img id="bg-first" class="bg-layer" src="./assets/bg-first.png" alt="" />
            <video id="bg-video" class="bg-layer" src="./assets/background-clean.mp4" muted playsinline preload="auto"></video>
            <img id="bg-last" class="bg-layer" src="./assets/bg-last.png" alt="" />

            <!-- Persistent Top-Left Brand Logo (30% width) -->
            <div class="brand-corner" id="brand-corner">
                <img src="./assets/brandLogoWithName.png" alt="ReceptionMonk" />
            </div>

            <!-- Section A: Opening / Clinic Scene -->
            <div class="section-overlay opening-overlay">
                <div class="incoming-call-wrap">
                    <div class="call-circle">
                        <svg class="call-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M20.01 15.38c-1.23 0-2.42-.2-3.53-.56a.977.977 0 0 0-1.01.24l-1.57 1.97c-2.83-1.35-5.48-3.9-6.89-6.83l1.95-1.66c.27-.28.35-.67.24-1.02-.37-1.11-.56-2.3-.56-3.53 0-.54-.45-.99-.99-.99H4.19C3.65 3 3 3.24 3 3.99 3 13.28 10.73 21 20.01 21c.71 0 .99-.63.99-1.18v-3.45c0-.54-.45-.99-.99-.99z" />
                        </svg>
                    </div>
                    <div class="call-status-pill">Incoming Call…</div>
                </div>
            </div>

            <!-- Section C: Conversation / Split Scene -->
            <div class="section-overlay conversation-overlay">
                <div class="participant-slot participant-slot--ai" aria-label="AI Receptionist">
                    <div class="badge-frame">
                        <img src="./assets/Glossy Orange Meditating Monk Badge.png" alt="AI Receptionist" />
                    </div>
                    <div class="participant-label-pill">AI RECEPTIONIST</div>
                </div>

                <div class="participant-slot participant-slot--customer" aria-label="Customer">
                    <div class="badge-frame">
                        <img src="./assets/Glossy Blue User Badge.png" alt="Customer" />
                    </div>
                    <div class="participant-label-pill">CUSTOMER</div>
                </div>

                <div class="central-waveform-wrap">
                    <div class="waveform-card">
                        <div class="waveform-slot" id="central-waveform"></div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <aside class="preview-controls" aria-label="Preview controls">
        <div class="controls-row">
            <button id="play-btn" disabled>Play</button>
            <button id="restart-btn" disabled>Restart</button>
            <span class="controls-meta" id="time-display">0:00.00 / 0:00.00</span>
        </div>
        <input id="scrubber" type="range" min="0" max="1" step="0.0333" value="0" disabled />
        <div class="controls-status" id="status">Initializing...</div>
        <div class="controls-error" id="error" hidden></div>
    </aside>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
